name: Meta Research Fast Journal Census
on:
  push:
    branches: [meta-research-journal-census-2026-09-26]
    paths: ['.github/workflows/meta-journal-census-fast.yml']
permissions:
  contents: write
jobs:
  fast-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meta-research-journal-census-2026-09-26
      - name: Run fast OpenAlex census
        run: python3 _meta_tmp/journal_census_fast.py
      - name: Commit outputs
        run: |
          git config user.name 'EP Meta Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add _meta_tmp/out_fast/
          git commit -m 'Generate fast Level A journal census 2025-2026' || exit 0
          git push origin HEAD:meta-research-journal-census-2026-09-26
